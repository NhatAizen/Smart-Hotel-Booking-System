name: EnziuRooms Platform CI

on:
  push:
    branches: [main, develop, ui/enziu-home-creative-rebuild, feat/manual-daily-pricing, feat/hotel-wallet-foundation]
  pull_request:
    branches: [main, develop, ui/enziu-home-creative-rebuild]

permissions:
  contents: read
  security-events: write

jobs:
  configuration:
    name: Compose and migration validation
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "NOTIFICATION_INTERNAL_API_KEY=ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Validate Flyway migration names and versions
        run: python scripts/check_flyway_migrations.py
      - name: Test fail-closed integration evidence checker
        run: python -m unittest discover -s .github/tests -p test_assert_surefire_gates.py

  frontend:
    name: Frontend lint and build
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend test - ${{ matrix.service }}
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ai-service, database: ai_ci }
          - { service: api-gateway, database: gateway_ci }
          - { service: booking-service, database: booking_ci }
          - { service: chat-service, database: chat_ci }
          - { service: hotel-service, database: hotel_ci }
          - { service: identity-service, database: identity_ci }
          - { service: notification-service, database: notification_ci }
          - { service: payment-service, database: payment_ci }
          - { service: realtime-service, database: realtime_ci }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ matrix.service }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ${{ matrix.database }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.database }}
      DB_USERNAME: ci_user
      DB_PASSWORD: ci-${{ github.run_id }}-${{ matrix.service }}
      TEST_DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.database }}
      TEST_DB_USERNAME: ci_user
      TEST_DB_PASSWORD: ci-${{ github.run_id }}-${{ matrix.service }}
      SPRING_RABBITMQ_HOST: localhost
      SPRING_DATA_REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "NOTIFICATION_INTERNAL_API_KEY=ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Test and package
        working-directory: services/${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress verify

  ekyc:
    name: eKYC tests
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ekyc-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ekyc-service/requirements.txt
            services/ekyc-service/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
        env:
          PYTHONPATH: .

  security-scan:
    name: Dependency and configuration scan
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  docker-build:
    name: Docker build - ${{ matrix.name }}
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    needs: [configuration, frontend, backend, ekyc, booking-financial-integration, booking-pricing-integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontend, context: frontend, file: infrastructure/deploy/frontend/Dockerfile }
          - { name: ai-service, context: services/ai-service, file: services/ai-service/Dockerfile }
          - { name: api-gateway, context: services/api-gateway, file: services/api-gateway/Dockerfile }
          - { name: booking-service, context: services/booking-service, file: services/booking-service/Dockerfile }
          - { name: chat-service, context: services/chat-service, file: services/chat-service/Dockerfile }
          - { name: ekyc-service, context: services/ekyc-service, file: services/ekyc-service/Dockerfile }
          - { name: hotel-service, context: services/hotel-service, file: services/hotel-service/Dockerfile }
          - { name: identity-service, context: services/identity-service, file: services/identity-service/Dockerfile }
          - { name: notification-service, context: services/notification-service, file: services/notification-service/Dockerfile }
          - { name: payment-service, context: services/payment-service, file: services/payment-service/Dockerfile }
          - { name: realtime-service, context: services/realtime-service, file: services/realtime-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Build image without publishing
        run: docker build --file "${{ matrix.file }}" --tag "enziurooms/${{ matrix.name }}:ci" "${{ matrix.context }}"

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  hotel-daily-pricing-postgres-upgrade:
    name: Hotel daily pricing upgrade on PostgreSQL 16
    if: github.ref == 'refs/heads/feat/manual-daily-pricing' || github.ref == 'refs/heads/ui/enziu-home-creative-rebuild' || (github.event_name == 'pull_request' && github.base_ref == 'ui/enziu-home-creative-rebuild')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_migration_ci
          POSTGRES_USER: ci_migration
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_migration -d hotel_migration_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/hotel_migration_ci
      DB_USERNAME: ci_migration
      DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_MIGRATION_POSTGRES: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration names and versions
        run: python scripts/check_flyway_migrations.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/hotel-service/pom.xml
      - name: Upgrade synthetic hotel catalog and verify daily price rule constraints
        working-directory: services/hotel-service
        run: mvn --batch-mode --no-transfer-progress -Dtest=HotelDailyPricingPostgresUpgradeTest test
      - name: Require executed migration gate with zero skips
        run: python .github/tests/assert_surefire_gates.py services/hotel-service/target/surefire-reports HotelDailyPricingPostgresUpgradeTest=1

  payment-v12-postgres-upgrade:
    name: Payment V12 to V14 PostgreSQL and Rabbit gates
    if: github.ref == 'refs/heads/feat/hotel-wallet-foundation' || github.ref == 'refs/heads/ui/enziu-home-creative-rebuild' || (github.event_name == 'pull_request' && github.base_ref == 'ui/enziu-home-creative-rebuild')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payment_migration_ci
          POSTGRES_USER: ci_migration
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_migration -d payment_migration_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci_financial
          RABBITMQ_DEFAULT_PASS: ci-${{ github.run_id }}-${{ github.run_attempt }}
          RABBITMQ_DEFAULT_VHOST: ci-financial
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/payment_migration_ci
      DB_USERNAME: ci_migration
      DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_MIGRATION_POSTGRES: "true"
      CI_RABBIT_INTEGRATION: "true"
      CI_RABBIT_HOST: 127.0.0.1
      CI_RABBIT_USERNAME: ci_financial
      CI_RABBIT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_RABBIT_VHOST: ci-financial
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration names and versions
        run: python scripts/check_flyway_migrations.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/payment-service/pom.xml
      - name: Verify V12 to V14 upgrades and real signed financial messaging
        working-directory: services/payment-service
        run: mvn --batch-mode --no-transfer-progress -Dtest=PaymentV12PostgresUpgradeTest,PaymentV13PostgresUpgradeTest,RoomChangeFinancialRabbitIntegrationTest test
      - name: Require every critical Payment gate with zero skips
        run: >-
          python .github/tests/assert_surefire_gates.py services/payment-service/target/surefire-reports
          PaymentV12PostgresUpgradeTest=1 PaymentV13PostgresUpgradeTest=2
          RoomChangeFinancialRabbitIntegrationTest=3

  booking-financial-integration:
    name: Booking PostgreSQL migration, concurrency and Rabbit gates
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop' || github.ref_name == 'ui/enziu-home-creative-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_migration_ci
          POSTGRES_USER: ci_migration
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_migration -d booking_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci_financial
          RABBITMQ_DEFAULT_PASS: ci-${{ github.run_id }}-${{ github.run_attempt }}
          RABBITMQ_DEFAULT_VHOST: ci-financial
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_BOOKING_MIGRATION_POSTGRES: "true"
      BOOKING_MIGRATION_DB_URL: jdbc:postgresql://localhost:5432/booking_migration_ci
      BOOKING_MIGRATION_DB_USERNAME: ci_migration
      BOOKING_MIGRATION_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_BOOKING_MUTATION_POSTGRES: "true"
      BOOKING_MUTATION_DB_URL: jdbc:postgresql://localhost:5432/booking_mutation_ci
      CI_RABBIT_INTEGRATION: "true"
      CI_RABBIT_HOST: 127.0.0.1
      CI_RABBIT_USERNAME: ci_financial
      CI_RABBIT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_RABBIT_VHOST: ci-financial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/booking-service/pom.xml
      - name: Create separate disposable concurrency database
        run: docker exec ${{ job.services.postgres.id }} createdb -U ci_migration --maintenance-db=booking_migration_ci booking_mutation_ci
      - name: Test migrations through .03, mutation serialization and real Rabbit routing
        working-directory: services/booking-service
        run: mvn --batch-mode --no-transfer-progress -Dtest=BookingRoomChangeOutboxPostgresUpgradeTest,BookingMutationPostgresConcurrencyTest,RoomChangeFinancialRabbitIntegrationTest test
      - name: Require every critical Booking gate with zero skips
        run: >-
          python .github/tests/assert_surefire_gates.py services/booking-service/target/surefire-reports
          BookingRoomChangeOutboxPostgresUpgradeTest=1 BookingMutationPostgresConcurrencyTest=7
          RoomChangeFinancialRabbitIntegrationTest=4

  booking-pricing-integration:
    name: Booking daily pricing PostgreSQL and Redis regression
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop' || github.ref_name == 'ui/enziu-home-creative-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_daily_ci
          POSTGRES_USER: ci_daily
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_daily -d booking_daily_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DAILY_PRICING_INTEGRATION: "true"
      DB_URL: jdbc:postgresql://localhost:5432/booking_daily_ci
      DB_USERNAME: ci_daily
      DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      HOTEL_SERVICE_URL: http://localhost:1
      IDENTITY_SERVICE_URL: http://localhost:1
      PAYMENT_SERVICE_URL: http://localhost:1
      NOTIFICATION_SERVICE_URL: http://localhost:1
      JPA_SHOW_SQL: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral test-only JWT secret
        shell: bash
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/booking-service/pom.xml
      - name: Test both enabled and disabled pricing against isolated services
        working-directory: services/booking-service
        run: mvn --batch-mode --no-transfer-progress -Dtest=CustomerDailyPricingPostgresRedisIntegrationTest,CustomerDailyPricingDisabledPostgresRedisIntegrationTest test
      - name: Require PostgreSQL and Redis regressions with zero skips
        run: >-
          python .github/tests/assert_surefire_gates.py services/booking-service/target/surefire-reports
          CustomerDailyPricingPostgresRedisIntegrationTest=6
          CustomerDailyPricingDisabledPostgresRedisIntegrationTest=1
