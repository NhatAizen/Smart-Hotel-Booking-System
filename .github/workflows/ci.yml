name: EnziuRooms Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  configuration:
    name: Compose and migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "NOTIFICATION_INTERNAL_API_KEY=ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Validate Flyway migration names and versions
        run: python scripts/check_flyway_migrations.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ai-service, database: ai_ci }
          - { service: api-gateway, database: gateway_ci }
          - { service: booking-service, database: booking_db }
          - { service: chat-service, database: chat_db }
          - { service: hotel-service, database: hotel_db }
          - { service: identity-service, database: identity_db }
          - { service: notification-service, database: notification_db }
          - { service: payment-service, database: payment_db }
          - { service: realtime-service, database: realtime_ci }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ matrix.service }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ${{ matrix.database }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.database }}
      DB_USERNAME: ci_user
      DB_PASSWORD: ci-${{ github.run_id }}-${{ matrix.service }}
      SPRING_RABBITMQ_HOST: localhost
      SPRING_DATA_REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "NOTIFICATION_INTERNAL_API_KEY=ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Test and package
        working-directory: services/${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress verify

  ekyc:
    name: eKYC tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ekyc-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ekyc-service/requirements.txt
            services/ekyc-service/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest -q

  security-scan:
    name: Dependency and configuration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  docker-build:
    name: Docker build - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [configuration, frontend, backend, ekyc]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontend, context: frontend, file: infrastructure/deploy/frontend/Dockerfile }
          - { name: ai-service, context: services/ai-service, file: services/ai-service/Dockerfile }
          - { name: api-gateway, context: services/api-gateway, file: services/api-gateway/Dockerfile }
          - { name: booking-service, context: services/booking-service, file: services/booking-service/Dockerfile }
          - { name: chat-service, context: services/chat-service, file: services/chat-service/Dockerfile }
          - { name: ekyc-service, context: services/ekyc-service, file: services/ekyc-service/Dockerfile }
          - { name: hotel-service, context: services/hotel-service, file: services/hotel-service/Dockerfile }
          - { name: identity-service, context: services/identity-service, file: services/identity-service/Dockerfile }
          - { name: notification-service, context: services/notification-service, file: services/notification-service/Dockerfile }
          - { name: payment-service, context: services/payment-service, file: services/payment-service/Dockerfile }
          - { name: realtime-service, context: services/realtime-service, file: services/realtime-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Build image without publishing
        run: docker build --file "${{ matrix.file }}" --tag "enziurooms/${{ matrix.name }}:ci" "${{ matrix.context }}"

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
