name: Customer daily pricing browser QA

on:
  push:
    branches: [integration/calendar-daily-pricing]
    paths:
      - .github/workflows/customer-daily-pricing-browser-e2e.yml
      - .github/tests/customer_daily_pricing_browser_env.py
      - .github/tests/browser/**
      - frontend/**
      - services/booking-service/**
      - services/hotel-service/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checkout:
    name: Browser quote, PRICE_CHANGED and booking
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_browser_ci
          POSTGRES_USER: ci_browser
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_browser -d booking_browser_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOOKING_DB_URL: jdbc:postgresql://127.0.0.1:5432/booking_browser_ci
      HOTEL_DB_URL: jdbc:postgresql://127.0.0.1:5432/hotel_browser_ci
      HOTEL_DB_NAME: hotel_browser_ci
      DB_USERNAME: ci_browser
      DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      QA_CUSTOMER_ID: 11111111-1111-4111-8111-111111111111
      QA_OWNER_ID: 22222222-2222-4222-8222-222222222222
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral test-only JWT secret
        shell: bash
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            services/booking-service/pom.xml
            services/hotel-service/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            .github/tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create disposable Hotel database
        run: >-
          docker exec ${{ job.services.postgres.id }}
          createdb -U ci_browser --maintenance-db=booking_browser_ci hotel_browser_ci
      - name: Install frontend and browser QA dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix .github/tests/browser
          npm exec --prefix .github/tests/browser -- playwright install --with-deps chromium
      - name: Package Hotel Service
        working-directory: services/hotel-service
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Package Booking Service
        working-directory: services/booking-service
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Run Customer browser checkout scenario
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: >-
          python .github/tests/customer_daily_pricing_browser_env.py
          --hotel-jar services/hotel-service/target/hotel-service-0.0.1-SNAPSHOT.jar
          --booking-jar services/booking-service/target/booking-service-0.0.1-SNAPSHOT.jar
          --frontend-dir frontend
          --browser-script .github/tests/browser/customer_daily_pricing_browser_e2e.mjs
          --artifact-dir .github/test-artifacts
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: customer-daily-pricing-browser-failure
          path: |
            .github/test-artifacts/**
            *-browser.log
            booking-service.log
          if-no-files-found: ignore
          retention-days: 7
