name: Identity Service CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"

    paths:
      - "services/identity-service/**"
      - ".github/workflows/identity-service-ci.yml"

  pull_request:
    branches:
      - main
      - develop

    paths:
      - "services/identity-service/**"
      - ".github/workflows/identity-service-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Identity Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/identity-service

    env:
      # Secret thử nghiệm, không sử dụng cho production.
      JWT_SECRET: TgvvB+E/RaVVss4JGC4ulmLvhoa0JL1H/K07htblWLc=

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            services/identity-service/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean test

      - name: Build executable JAR
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            package \
            -DskipTests

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: identity-service-jar
          path: services/identity-service/target/*.jar
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Verify Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Identity Service Docker image
        run: |
          docker build \
            --tag smart-hotel-identity-service:ci \
            services/identity-service