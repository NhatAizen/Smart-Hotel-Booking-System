name: smart-hotel-booking-system

services:

  # =========================================================
  # DATABASES
  # =========================================================

  identity-postgres:
    image: postgres:16-alpine
    container_name: smart-hotel-identity-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_password

    ports:
      - "5433:5432"

    volumes:
      - identity_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U identity_user -d identity_db
      interval: 10s
      timeout: 5s
      retries: 5


  hotel-postgres:
    image: postgres:16-alpine
    container_name: smart-hotel-hotel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password

    ports:
      - "5434:5432"

    volumes:
      - hotel_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U hotel_user -d hotel_db
      interval: 10s
      timeout: 5s
      retries: 5


  booking-postgres:
    image: postgres:16-alpine
    container_name: smart-hotel-booking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_password

    ports:
      - "5435:5432"

    volumes:
      - booking_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U booking_user -d booking_db
      interval: 10s
      timeout: 5s
      retries: 5


  payment-postgres:
    image: postgres:16-alpine
    container_name: smart-hotel-payment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password

    ports:
      - "5436:5432"

    volumes:
      - payment_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U payment_user -d payment_db
      interval: 10s
      timeout: 5s
      retries: 5


  notification-postgres:
    image: postgres:16-alpine
    container_name: smart-hotel-notification-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password

    ports:
      - "5437:5432"

    volumes:
      - notification_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U notification_user -d notification_db
      interval: 10s
      timeout: 5s
      retries: 5


  chat-postgres:
    image: postgres:16-alpine
    container_name: smart-hotel-chat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password

    ports:
      - "5438:5432"

    volumes:
      - chat_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U chat_user -d chat_db
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # DEVELOPMENT INFRASTRUCTURE
  # =========================================================

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: smart-hotel-mailpit
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"



  redis:
    image: redis:7-alpine
    container_name: smart-hotel-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smart-hotel-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-enziu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-enziu_dev}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infrastructure/rabbitmq/config/definitions.json:/etc/rabbitmq/definitions.json:ro

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  # =========================================================
  # BACKEND SERVICES
  # =========================================================

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile

    container_name: smart-hotel-identity-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8081

      DB_URL: jdbc:postgresql://identity-postgres:5432/identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: identity_password

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}

      OAUTH_FRONTEND_REDIRECT: ${OAUTH_FRONTEND_REDIRECT:-http://localhost:5300/oauth2/callback}

      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_APP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}

      MAIL_SMTP_AUTH: "true"
      MAIL_STARTTLS_ENABLE: "true"

      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5300}
      PUBLIC_BASE_URL: http://localhost:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8085

      JWT_SECRET: ${JWT_SECRET}
      JPA_SHOW_SQL: "false"

      PROFILE_MEDIA_UPLOAD_DIR: /app/uploads/profiles
      PUBLIC_PROFILE_MEDIA_BASE_URL: http://localhost:8080/api/users/media
      PROFILE_MEDIA_MAX_FILE_SIZE_BYTES: 5242880

      PARTNER_DOCUMENT_UPLOAD_DIR: /app/uploads/partner-documents
      PARTNER_DOCUMENT_MAX_FILE_SIZE_BYTES: 8388608
      PARTNER_OCR_COMMAND: tesseract
      PARTNER_OCR_LANGUAGES: vie+eng
      PARTNER_OCR_TIMEOUT_SECONDS: 20

      PARTNER_EKYC_BASE_URL: http://ekyc-service:8090
      PARTNER_EKYC_INTERNAL_API_KEY: ${EKYC_INTERNAL_API_KEY:-dev-ekyc-internal-key-change-me}
      PARTNER_EKYC_CONNECT_TIMEOUT_SECONDS: 5
      PARTNER_EKYC_READ_TIMEOUT_SECONDS: 35

    ports:
      - "8081:8081"

    volumes:
      - identity_profile_media_data:/app/uploads/profiles
      - identity_partner_document_data:/app/uploads/partner-documents

    depends_on:
      identity-postgres:
        condition: service_healthy

      mailpit:
        condition: service_started

      ekyc-service:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8081/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s


  hotel-service:
    build:
      context: ./services/hotel-service
      dockerfile: Dockerfile

    container_name: smart-hotel-hotel-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8082

      MEDIA_UPLOAD_DIR: /app/uploads
      PUBLIC_MEDIA_BASE_URL: http://localhost:8080/api/hotels/media
      MEDIA_MAX_FILE_SIZE_BYTES: 10485760

      NOTIFICATION_SERVICE_URL: http://notification-service:8085

      DB_URL: jdbc:postgresql://hotel-postgres:5432/hotel_db
      DB_USERNAME: hotel_user
      DB_PASSWORD: hotel_password

      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      JPA_SHOW_SQL: "false"

    volumes:
      - hotel_media_data:/app/uploads

    ports:
      - "8082:8082"

    depends_on:
      hotel-postgres:
        condition: service_healthy

      notification-service:
        condition: service_healthy

      identity-service:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8082/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s


  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile

    container_name: smart-hotel-booking-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8083

      DB_URL: jdbc:postgresql://booking-postgres:5432/booking_db
      DB_USERNAME: booking_user
      DB_PASSWORD: booking_password

      HOTEL_SERVICE_URL: http://hotel-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      IDENTITY_SERVICE_URL: http://identity-service:8081
      JWT_SECRET: ${JWT_SECRET}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-enziu}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enziu_dev}

      REVIEW_MEDIA_UPLOAD_DIR: /app/uploads/reviews
      PUBLIC_REVIEW_MEDIA_BASE_URL: http://localhost:8080/api/reviews/media
      REVIEW_MEDIA_MAX_FILE_SIZE_BYTES: 5242880

      JPA_SHOW_SQL: "false"

    volumes:
      - booking_review_media_data:/app/uploads/reviews

    ports:
      - "8083:8083"

    depends_on:
      booking-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8083/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s


  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile

    container_name: smart-hotel-payment-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8084

      DB_URL: jdbc:postgresql://payment-postgres:5432/payment_db
      DB_USERNAME: payment_user
      DB_PASSWORD: payment_password

      BOOKING_SERVICE_URL: http://booking-service:8083
      HOTEL_SERVICE_URL: http://hotel-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      IDENTITY_SERVICE_URL: http://identity-service:8081

      JWT_SECRET: ${JWT_SECRET}

      PAYOS_ENABLED: ${PAYOS_ENABLED:-true}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}
      PAYOS_BASE_URL: ${PAYOS_BASE_URL:-https://api-merchant.payos.vn}

      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:5300/payment/payos/success}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:5300/payment/payos/cancel}
      PAYOS_WEBHOOK_URL: ${PAYOS_WEBHOOK_URL:-}

      PAYOS_COMMISSION_RATE: ${PAYOS_COMMISSION_RATE:-10.00}
      PAYOS_AUTO_RELEASE_HOTEL_REVENUE: ${PAYOS_AUTO_RELEASE_HOTEL_REVENUE:-false}
      PAYOS_PAYOUT_ENABLED: ${PAYOS_PAYOUT_ENABLED:-false}

      JPA_SHOW_SQL: "false"

    ports:
      - "8084:8084"

    depends_on:
      payment-postgres:
        condition: service_healthy

      booking-service:
        condition: service_healthy

      identity-service:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8084/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s


  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile

    container_name: smart-hotel-notification-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8085

      DB_URL: jdbc:postgresql://notification-postgres:5432/notification_db
      DB_USERNAME: notification_user
      DB_PASSWORD: notification_password

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: no-reply@smarthotel.local

      JPA_SHOW_SQL: "false"

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-enziu}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enziu_dev}

    ports:
      - "8085:8085"

    depends_on:
      notification-postgres:
        condition: service_healthy

      mailpit:
        condition: service_started

      rabbitmq:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8085/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s


  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile

    container_name: smart-hotel-ai-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8086

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
      GEMINI_TIMEOUT_SECONDS: 30

      JWT_SECRET: ${JWT_SECRET}
      HOTEL_SERVICE_URL: http://hotel-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083

    ports:
      - "8086:8086"

    depends_on:
      hotel-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8086/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  ekyc-service:
    build:
      context: ./services/ekyc-service
      dockerfile: Dockerfile

    container_name: smart-hotel-ekyc-service
    restart: unless-stopped

    environment:
      EKYC_INTERNAL_API_KEY: ${EKYC_INTERNAL_API_KEY:-dev-ekyc-internal-key-change-me}
      EKYC_TOKEN_SECRET: ${EKYC_TOKEN_SECRET:-dev-ekyc-token-secret-change-me-32bytes-minimum}
      EKYC_CHALLENGE_TTL_SECONDS: 300
      EKYC_FACE_MATCH_THRESHOLD: ${EKYC_FACE_MATCH_THRESHOLD:-0.42}
      EKYC_LIVE_CONSISTENCY_THRESHOLD: ${EKYC_LIVE_CONSISTENCY_THRESHOLD:-0.34}
      EKYC_ID_MIN_BLUR_VARIANCE: ${EKYC_ID_MIN_BLUR_VARIANCE:-20}
      EKYC_LIVE_MIN_BLUR_VARIANCE: ${EKYC_LIVE_MIN_BLUR_VARIANCE:-20}
      EKYC_FRONT_MIN_FRAME_DIFFERENCE: ${EKYC_FRONT_MIN_FRAME_DIFFERENCE:-0.65}
      EKYC_CHALLENGE_RATE_LIMIT_COUNT: ${EKYC_CHALLENGE_RATE_LIMIT_COUNT:-5}
      EKYC_CHALLENGE_RATE_LIMIT_WINDOW_SECONDS: ${EKYC_CHALLENGE_RATE_LIMIT_WINDOW_SECONDS:-600}

    expose:
      - "8090"

    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3).read()" || exit 1
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s


  realtime-service:
    build:
      context: ./services/realtime-service
      dockerfile: Dockerfile

    container_name: smart-hotel-realtime-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8087
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-enziu}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enziu_dev}
      REALTIME_EXCHANGE: enziurooms.events
      REALTIME_QUEUE: enziurooms.realtime

    ports:
      - "8087:8087"

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8087/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile

    container_name: smart-hotel-chat-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8088

      DB_URL: jdbc:postgresql://chat-postgres:5432/chat_db
      DB_USERNAME: chat_user
      DB_PASSWORD: chat_password

      JWT_SECRET: ${JWT_SECRET}

      BOOKING_SERVICE_URL: http://booking-service:8083
      HOTEL_SERVICE_URL: http://hotel-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      AI_SERVICE_URL: http://ai-service:8086

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-enziu}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-enziu_dev}

      CHAT_SYNC_INITIAL_DELAY_MS: 15000
      CHAT_SYNC_FIXED_DELAY_MS: 60000
      CHAT_REMINDER_DISPATCH_DELAY_MS: 30000

    ports:
      - "8088:8088"

    depends_on:
      chat-postgres:
        condition: service_healthy

      booking-service:
        condition: service_healthy

      hotel-service:
        condition: service_healthy

      notification-service:
        condition: service_healthy

      ai-service:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8088/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s


  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile

    container_name: smart-hotel-api-gateway
    restart: unless-stopped

    environment:
      SERVER_PORT: 8080

      JWT_SECRET: ${JWT_SECRET}

      IDENTITY_SERVICE_URL: http://identity-service:8081
      HOTEL_SERVICE_URL: http://hotel-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      AI_SERVICE_URL: http://ai-service:8086
      REALTIME_SERVICE_WS_URL: ws://realtime-service:8087
      CHAT_SERVICE_URL: http://chat-service:8088

    ports:
      - "8080:8080"

    depends_on:
      identity-service:
        condition: service_healthy

      hotel-service:
        condition: service_healthy

      booking-service:
        condition: service_healthy

      payment-service:
        condition: service_healthy

      notification-service:
        condition: service_healthy

      ai-service:
        condition: service_healthy

      realtime-service:
        condition: service_healthy

      chat-service:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


volumes:
  identity_postgres_data:
  identity_profile_media_data:
  identity_partner_document_data:
  hotel_postgres_data:
  booking_postgres_data:
  payment_postgres_data:
  notification_postgres_data:
  chat_postgres_data:
  hotel_media_data:
  booking_review_media_data:
  redis_data:
  rabbitmq_data:
