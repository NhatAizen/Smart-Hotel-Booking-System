map $status $enziu_asset_cache {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content hashes remain valid for open tabs across frontend deployments.
    location ^~ /assets/ {
        root /var/cache/enziu-frontend;
        try_files $uri =404;
        add_header Cache-Control $enziu_asset_cache always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /bootstrap-recovery.js {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
