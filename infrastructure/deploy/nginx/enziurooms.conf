map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $enziu_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Deliberately omit query strings so JWTs used by the current WebSocket handshake
# are not written to the reverse-proxy access log.
log_format enziu_main '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" request_id=$request_id';

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    access_log /var/log/nginx/access.log enziu_main;

    # OAuth2: ONLY the authorization-start endpoint goes to Identity Service.
    # IMPORTANT: do NOT proxy all /oauth2/ paths, because
    # /oauth2/callback is a React frontend route.
    location ^~ /oauth2/authorization/ {
        proxy_pass http://identity-service:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $enziu_forwarded_proto;

        proxy_read_timeout 120s;
    }

    # OAuth provider callback handled by Spring Security OAuth2 Login.
    location ^~ /login/oauth2/ {
        proxy_pass http://identity-service:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $enziu_forwarded_proto;

        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $enziu_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://api-gateway:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $enziu_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # React/Vite frontend.
    # This intentionally includes /oauth2/callback.
    location / {
        proxy_pass http://frontend-prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $enziu_forwarded_proto;
    }
}
