spring:
  application:
    name: ai-service

server:
  port: ${SERVER_PORT:8086}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=${spring.application.name} level=%-5level correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

security:
  jwt:
    secret: ${JWT_SECRET}

clients:
  hotel:
    base-url: ${HOTEL_SERVICE_URL:http://localhost:8082}
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}

app:
  places:
    enabled: ${AI_PLACES_ENABLED:true}
    base-url: ${AI_PLACES_BASE_URL:https://photon.komoot.io}
  semantic:
    enabled: ${AI_SEMANTIC_ENABLED:false}
    base-url: ${AI_SEMANTIC_URL:http://semantic-service:8091}
