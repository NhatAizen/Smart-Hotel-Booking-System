spring:
  application:
    name: ai-service

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}

clients:
  hotel:
    base-url: ${HOTEL_SERVICE_URL:http://localhost:8082}