spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "http://localhost:5300"
              - "http://127.0.0.1:5300"
              - "http://localhost:3000"
              - "https://*.trycloudflare.com"
              - "https://enziurooms.xyz"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            exposed-headers:
              - Authorization
              - Location
            allow-credentials: true
            max-age: 3600

      routes:
        - id: realtime-websocket
          order: -100
          uri: ${REALTIME_SERVICE_WS_URL:ws://localhost:8087}
          predicates:
            - Path=/ws/**

        - id: notification-user-inbox
          order: -30
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/users/*/notifications,/api/users/*/notifications/**

        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/partner-requests/**,/api/admin/partner-requests/**,/api/admin/users/**

        - id: booking-service-hotel-bookings
          order: -20
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/hotels/*/bookings

        - id: hotel-service
          uri: ${HOTEL_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/hotels/**,/api/room-types/**,/api/rooms/**,/api/admin/hotels/**,/api/admin/room-types/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**,/api/bookings/*/payments,/api/customers/*/payments,/api/wallets/**,/api/withdrawals/**,/api/refunds/**,/api/admin/wallet/**,/api/admin/withdrawals/**,/api/admin/payments/**,/api/admin/refunds/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/bookings/**,/api/customers/*/bookings,/api/availability/**,/api/pricing/**,/api/reviews/**,/api/favorites/**,/api/membership/**,/api/promotions/**,/api/discounts/**,/api/campaigns/**,/api/hotel-admin/promotions/**,/api/hotel-admin/reviews/**,/api/admin/promotions/**,/api/admin/campaigns/**,/api/admin/membership-tiers/**,/api/admin/reviews/**

        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/chat/**,/api/hotel-admin/chat/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/notifications/**

        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/ai/**

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO