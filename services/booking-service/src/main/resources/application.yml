spring:
  application:
    name: booking-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 80MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/booking_db}
    username: ${DB_USERNAME:booking_user}
    password: ${DB_PASSWORD:booking_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8083}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=${spring.application.name} level=%-5level correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when_authorized
clients:
  hotel:
    base-url: ${HOTEL_SERVICE_URL:http://hotel-service:8082}
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
    api-key: ${NOTIFICATION_INTERNAL_API_KEY:dev-notification-internal-key-change-me}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://payment-service:8084}

security:
  jwt:
    secret: ${JWT_SECRET}

reviews:
  media:
    upload-dir: ${REVIEW_MEDIA_UPLOAD_DIR:./uploads/reviews}
    public-base-url: ${PUBLIC_REVIEW_MEDIA_BASE_URL:http://localhost:8080/api/reviews/media}
    max-file-size-bytes: ${REVIEW_MEDIA_MAX_FILE_SIZE_BYTES:5242880}

complaints:
  media:
    upload-dir: ${COMPLAINT_MEDIA_UPLOAD_DIR:./uploads/complaints}
    max-file-size-bytes: ${COMPLAINT_MEDIA_MAX_FILE_SIZE_BYTES:10485760}

booking:
  hold:
    ttl-seconds: ${BOOKING_HOLD_TTL_SECONDS:600}
    cleanup-delay-ms: ${BOOKING_HOLD_CLEANUP_DELAY_MS:5000}

pricing:
  manual-daily-customer-enabled: ${MANUAL_DAILY_CUSTOMER_PRICING_ENABLED:false}
  weekend-surcharge-percent: ${WEEKEND_SURCHARGE_PERCENT:10}
  late-checkout:
    grace-minutes: ${LATE_CHECKOUT_GRACE_MINUTES:60}
    up-to-3-hours-percent: ${LATE_CHECKOUT_3H_PERCENT:30}
    up-to-6-hours-percent: ${LATE_CHECKOUT_6H_PERCENT:50}
