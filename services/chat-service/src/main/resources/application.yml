spring:
  application:
    name: chat-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/chat_db}
    username: ${DB_USERNAME:chat_user}
    password: ${DB_PASSWORD:chat_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:enziu}
    password: ${RABBITMQ_PASSWORD:enziu_dev}
    connection-timeout: 5000

server:
  port: ${SERVER_PORT:8088}

security:
  jwt:
    secret: ${JWT_SECRET}

clients:
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://booking-service:8083}
  hotel:
    base-url: ${HOTEL_SERVICE_URL:http://hotel-service:8082}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
    api-key: ${NOTIFICATION_INTERNAL_API_KEY:dev-notification-internal-key-change-me}
  ai:
    base-url: ${AI_SERVICE_URL:http://ai-service:8086}

chat:
  sync:
    initial-delay-ms: ${CHAT_SYNC_INITIAL_DELAY_MS:15000}
    fixed-delay-ms: ${CHAT_SYNC_FIXED_DELAY_MS:60000}
  reminders:
    dispatch-delay-ms: ${CHAT_REMINDER_DISPATCH_DELAY_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=${spring.application.name} level=%-5level correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n"
  level:
    com.smarthotel.chat: INFO
