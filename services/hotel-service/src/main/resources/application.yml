spring:
  application:
    name: hotel-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/hotel_db}
    username: ${DB_USERNAME:hotel_user}
    password: ${DB_PASSWORD:hotel_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always