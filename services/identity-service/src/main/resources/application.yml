spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/identity_db}
    username: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD:identity_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: smart-hotel-identity-service
    expiration-seconds: 3600
    refresh-expiration-seconds: 2592000

  mail:
    from: ${MAIL_FROM:no-reply@smarthotel.local}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8081}
    verification-expiration-seconds: 86400
    password-reset-expiration-seconds: 1800

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  packages-to-scan:
    - com.smarthotel.identity.auth.controller
    - com.smarthotel.identity.user.controller