spring:
  application:
    name: realtime-service
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8087}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:smart-hotel-identity-service}
  realtime:
    exchange: ${REALTIME_EXCHANGE:enziurooms.events}
    queue: ${REALTIME_QUEUE:enziurooms.realtime}
    allowed-origin-patterns: ${REALTIME_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://localhost,capacitor://localhost,ionic://localhost,https://enziurooms.xyz}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=${spring.application.name} level=%-5level correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n"
  level:
    com.smarthotel.realtime: INFO
    org.springframework.amqp: WARN
